<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daksha demo walkthrough</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face { font-family: Figtree; font-weight: 500; src: url(/assets/figtree-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: Figtree; font-weight: 700; src: url(/assets/figtree-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: Figtree; font-weight: 800; src: url(/assets/figtree-latin-800-normal.woff2) format("woff2"); }
/* The app's pastel ("Genie") colours: mist page, deep ink, Daksha blue and soft glows. */
:root { --ink: #161a2b; --blue: #3451d1; --paper: #f3f5fa; --sky: #c4d9ff; --lilac: #dcd0ff; --blush: #ffd3e1; --mint: #c8eeda; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--paper); overflow: hidden; }
body { font-family: Figtree, system-ui, sans-serif; color: var(--ink); }
#stage { position: relative; overflow: hidden; background: var(--paper); width: 1920px; height: 1080px; }
#stage > * { position: absolute; }
.circle { border-radius: 50%; }
.wipe { left: 0; top: 0; width: 100%; height: 100%; background: var(--blue); }
.glows { left: 0; top: 0; width: 100%; height: 100%; background: radial-gradient(1100px 800px at 8% 4%, rgba(196,217,255,.95), transparent 70%), radial-gradient(1000px 760px at 96% 10%, rgba(220,208,255,.9), transparent 70%), radial-gradient(1000px 800px at 88% 80%, rgba(255,211,225,.55), transparent 70%), radial-gradient(1000px 760px at 6% 92%, rgba(200,238,218,.6), transparent 70%), var(--paper); }
#phone { left: 0; top: 0; width: 780px; height: 1688px; transform-origin: 0 0; will-change: transform; }
#phone .body { position: absolute; inset: 0; border-radius: 64px; background: var(--paper);
  box-shadow: 0 0 0 24px var(--ink), 0 0 0 27px #3a3f55, 0 90px 150px -10px rgba(22,26,43,.30), 0 30px 60px rgba(22,26,43,.16); }
#phone .screen { position: absolute; inset: 0; border-radius: 64px; overflow: hidden; background: var(--paper); }
#phone img { position: absolute; left: 0; top: 0; width: 780px; height: 1688px; }
#bug { left: 120px; top: 60px; display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 40px; letter-spacing: -0.01em; }
#bug svg { width: 56px; height: 56px; }
#cap { left: 150px; top: 330px; width: 780px; }
#cap .label { font-weight: 700; font-size: 30px; color: var(--blue); margin-bottom: 18px; }
#cap h1 { font-weight: 800; font-size: 88px; letter-spacing: -0.02em; line-height: 1.04; }
#cap p { font-weight: 500; font-size: 40px; line-height: 1.28; opacity: 0.72; margin-top: 30px; }
.w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.06em 0.14em 0.12em 0; margin: -0.06em -0.14em -0.12em 0; }
.wi { display: inline-block; will-change: transform; }
#dots { left: 150px; top: 900px; display: flex; gap: 12px; }
#dots i { display: block; width: 64px; height: 10px; border-radius: 99px; background: rgba(22,26,43,.12); }
#dots i.on { background: var(--blue); }
#dots i.done { background: rgba(22,26,43,.42); }
#speed { left: 0; top: 0; background: var(--ink); color: #fff; font-weight: 700; font-size: 28px; padding: 12px 24px 14px; border-radius: 999px; box-shadow: 0 10px 30px rgba(22,26,43,.18); white-space: nowrap; }
.card { left: 0; top: 0; width: 100%; text-align: center; color: #fff; }
.card h1 { font-weight: 800; letter-spacing: -0.02em; line-height: 1.04; }
.card p { font-weight: 500; opacity: 0.9; }
.tomato { transform-origin: 50% 90%; }
.url { display: inline-block; background: var(--ink); color: #fff; font-weight: 800; border-radius: 999px; font-size: 68px; padding: 0.28em 0.8em 0.32em; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="/src/tomato.js"></script>
<script src="/demo/timeline.js"></script>
<script src="/demo/engine.js"></script>
</body>
</html>
