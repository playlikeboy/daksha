<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daksha launch video</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face { font-family: Figtree; font-weight: 500; src: url(/assets/figtree-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: Figtree; font-weight: 700; src: url(/assets/figtree-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: Figtree; font-weight: 800; src: url(/assets/figtree-latin-800-normal.woff2) format("woff2"); }
:root { --ink: #1b1b1b; --red: #e5392b; --red-dark: #c42a20; --leaf: #2f7d33; --paper: #f4f2ee; --blush: #fde3de; --pink: #ffb0a8; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--ink); overflow: hidden; }
body { font-family: Figtree, system-ui, sans-serif; color: var(--ink); }
#stage { position: relative; overflow: hidden; background: var(--ink); transform-origin: 0 0; }
#stage > * { position: absolute; }
.wipe { left: 0; top: 0; width: 100%; height: 100%; }
#blob { border-radius: 50%; background: var(--blush); }
#phone { left: 0; top: 0; width: 780px; height: 1688px; transform-origin: 0 0; will-change: transform; }
#phone .body { position: absolute; inset: 0; border-radius: 64px; background: #f0f0f0;
  box-shadow: 0 0 0 24px var(--ink), 0 0 0 27px #4a4a4a, 0 90px 150px -10px rgba(27,27,27,.35), 0 30px 60px rgba(27,27,27,.18); }
#phone .screen { position: absolute; inset: 0; border-radius: 64px; overflow: hidden; background: #f0f0f0; }
#phone img { position: absolute; left: 0; top: 0; width: 780px; height: 1688px; }
.tb { left: 0; top: 0; }
.tb h1 { font-weight: 800; letter-spacing: -0.02em; line-height: 1.04; }
.tb .ln { display: block; }
.w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.06em 0.14em 0.12em 0; margin: -0.06em -0.14em -0.12em 0; }
.wi { display: inline-block; will-change: transform; }
.tb p { font-weight: 500; line-height: 1.28; opacity: 0.72; }
.badge { display: inline-block; font-weight: 800; font-size: 30px; padding: 8px 22px; border-radius: 999px; background: var(--red); color: #fff; margin-bottom: 22px; }
.pill { left: 0; top: 0; background: var(--ink); color: #fff; font-weight: 700; display: flex; align-items: center; gap: 16px; border-radius: 999px; box-shadow: 0 14px 40px rgba(27,27,27,.25); white-space: nowrap; }
.pill i { width: 14px; height: 14px; border-radius: 50%; background: var(--red); flex: none; }
#lines { left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
#bug { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 40px; letter-spacing: -0.01em; }
#bug svg { width: 56px; height: 56px; }
.tomato { transform-origin: 50% 90%; }
.url { display: inline-block; background: #fff; color: var(--ink); font-weight: 800; border-radius: 999px; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="/src/tomato.js"></script>
<script src="/src/timeline.js"></script>
<script src="/src/engine.js"></script>
</body>
</html>
