# Deploy the Daksha app (os/) to Cloudflare Workers + Containers at my.daksha.life and api.daksha.life.
# api.debo.life is the same API and keeps serving (installed phone apps and the OAuth callbacks use it).
# my.debo.life sends people on to my.daksha.life with a 307 (see docs/DOMAINS.md).
# Runs on a push to main that touches it, or by hand. Separate from deploy.yml: it never touches the debo-web Worker, which still serves daksha.life.
# Deploys three Workers: debo-os-browser (private), debo-os-api, debo-os-app.
# Secrets used (names only; set in GitHub repo settings > Secrets). See
# os/infra/cloudflare/README.md for how to create each one.
#   Already exist:
#     CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   - needs Workers + Containers edit
#     DATABASE_URL_UNPOOLED                         - Daksha's Neon database (os keeps its rows in schema "os")
#     MEM0_API_KEY, LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET, VOICE_AGENT_SECRET
#   Must be created (required):
#     NEON_AUTH_BASE_URL, NEON_AUTH_JWKS_URL        - same values the web app uses
#     ANTHROPIC_API_KEY                             - answers and the agent (MODEL is anthropic/claude-haiku-5-5)
#     DEBO_OS_TOKEN_ENCRYPTION_KEY                  - 32 random bytes, base64
#     DEBO_OS_SESSION_SIGNING_KEY                   - 32 random bytes, base64
#     DEBO_OS_WORKER_TOKEN                          - 32+ characters, shared API <-> browser
#   Voice notes and videos need NO secrets: the API Worker binds the private R2 bucket (MEDIA) and Workers AI (AI)
#   and passes MEDIA_BACKEND=binding / AI_BACKEND=binding to the container (see os/docs/JOURNAL-MEDIA.md).
#   The deploy token (CLOUDFLARE_API_TOKEN) must be allowed to attach both bindings.
#   Optional (only to switch recordings to direct presigned R2 links and the Workers AI REST API instead):
#     R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY        - an R2 API token for the debo-journal-media bucket only
#     CF_AI_API_TOKEN                               - Workers AI token
#   Optional:
#     NEON_AI_GATEWAY_BASE_URL, NEON_AI_GATEWAY_TOKEN - search by meaning (keyword search works without)
#     DEBO_OS_VAPID_PUBLIC_KEY, DEBO_OS_VAPID_PRIVATE_KEY - web push for reminders (npx web-push generate-vapid-keys);
#                                                   DAKSHA_OS_VAPID_* are optional new names for them, used first;
#                                                   without both, push is off and the app hides the switch
name: Deploy OS

on:
  push:
    branches: [main]
    paths: ["os/**", "packages/**", "third_party/hermes-skills/**", ".github/workflows/deploy-os.yml", ".dockerignore"]
  workflow_dispatch:

concurrency:
  group: deploy-os
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Check required secrets are set
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          NEON_AUTH_BASE_URL: ${{ secrets.NEON_AUTH_BASE_URL }}
          NEON_AUTH_JWKS_URL: ${{ secrets.NEON_AUTH_JWKS_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEBO_OS_TOKEN_ENCRYPTION_KEY: ${{ secrets.DEBO_OS_TOKEN_ENCRYPTION_KEY }}
          DEBO_OS_SESSION_SIGNING_KEY: ${{ secrets.DEBO_OS_SESSION_SIGNING_KEY }}
          DEBO_OS_WORKER_TOKEN: ${{ secrets.DEBO_OS_WORKER_TOKEN }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL_UNPOOLED \
            NEON_AUTH_BASE_URL NEON_AUTH_JWKS_URL ANTHROPIC_API_KEY \
            DEBO_OS_TOKEN_ENCRYPTION_KEY DEBO_OS_SESSION_SIGNING_KEY DEBO_OS_WORKER_TOKEN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then echo "::error::Missing GitHub secrets:$missing"; exit 1; fi

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: os/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # wrangler builds the container images with Docker (BuildKit).
      - uses: docker/setup-buildx-action@v3

      # The app lives on its own addresses. daksha.life itself stays on the debo-web Worker.
      - name: Set the addresses
        id: urls
        run: |
          # The address built into the app, and where it signs in.
          echo "api=https://api.daksha.life" >> "$GITHUB_OUTPUT"
          echo "app=https://my.daksha.life" >> "$GITHUB_OUTPUT"
          # PUBLIC_API_URL stays on api.debo.life for now: the Google, Composio and tool server
          # callbacks are built from it and are registered with those services on that address.
          # api.debo.life also keeps serving the phone apps that were installed before the rename.
          echo "callback_api=https://api.debo.life" >> "$GITHUB_OUTPUT"
          # The app's address from before the rename. Its Worker sends every request on to
          # the same path on my.daksha.life.
          echo "old_app=https://my.debo.life" >> "$GITHUB_OUTPUT"

      - name: Install
        run: |
          pnpm --dir os install --frozen-lockfile
          npm --prefix os/infra/cloudflare ci

      - name: Build the web app (API URL is baked in)
        working-directory: os
        env:
          EXPO_PUBLIC_API_URL: ${{ steps.urls.outputs.api }}
        run: |
          pnpm build:web
          # Guard: the API address must be inside the exported JavaScript (a stale cache would hide it).
          grep -rlF "$EXPO_PUBLIC_API_URL" apps/mobile/dist/web/_expo >/dev/null

      - name: Deploy the browser (private)
        working-directory: os/infra/cloudflare
        env:
          WORKER_TOKEN: ${{ secrets.DEBO_OS_WORKER_TOKEN }}
        run: |
          jq -n '{WORKER_TOKEN: env.WORKER_TOKEN}' > "$RUNNER_TEMP/browser-secrets.json"
          npx wrangler deploy -c browser/wrangler.jsonc --secrets-file "$RUNNER_TEMP/browser-secrets.json"

      - name: Deploy the API
        working-directory: os/infra/cloudflare
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          NEON_AUTH_BASE_URL: ${{ secrets.NEON_AUTH_BASE_URL }}
          NEON_AUTH_JWKS_URL: ${{ secrets.NEON_AUTH_JWKS_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEON_AI_GATEWAY_BASE_URL: ${{ secrets.NEON_AI_GATEWAY_BASE_URL }}
          NEON_AI_GATEWAY_TOKEN: ${{ secrets.NEON_AI_GATEWAY_TOKEN }}
          MEM0_API_KEY: ${{ secrets.MEM0_API_KEY }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_AI_API_TOKEN: ${{ secrets.CF_AI_API_TOKEN }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          VOICE_AGENT_SECRET: ${{ secrets.VOICE_AGENT_SECRET }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.DEBO_OS_TOKEN_ENCRYPTION_KEY }}
          SESSION_SIGNING_KEY: ${{ secrets.DEBO_OS_SESSION_SIGNING_KEY }}
          WORKER_TOKEN: ${{ secrets.DEBO_OS_WORKER_TOKEN }}
          # The DAKSHA_ names are optional new names for the same secrets (docs/RENAME.md).
          DEBO_OS_VAPID_PUBLIC_KEY: ${{ secrets.DAKSHA_OS_VAPID_PUBLIC_KEY || secrets.DEBO_OS_VAPID_PUBLIC_KEY }}
          DEBO_OS_VAPID_PRIVATE_KEY: ${{ secrets.DAKSHA_OS_VAPID_PRIVATE_KEY || secrets.DEBO_OS_VAPID_PRIVATE_KEY }}
          DEBO_OS_VAPID_SUBJECT: ${{ secrets.DAKSHA_OS_VAPID_SUBJECT || secrets.DEBO_OS_VAPID_SUBJECT }}
        run: |
          # Empty values are dropped, so an optional secret that is not set just turns its feature off.
          jq -n 'env | {DATABASE_URL, NEON_AUTH_BASE_URL, NEON_AUTH_JWKS_URL, ANTHROPIC_API_KEY,
                  NEON_AI_GATEWAY_BASE_URL, NEON_AI_GATEWAY_TOKEN, MEM0_API_KEY, COMPOSIO_API_KEY,
                  R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, CF_AI_API_TOKEN,
                  LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET, VOICE_AGENT_SECRET, CARTESIA_API_KEY,
                  TOKEN_ENCRYPTION_KEY, SESSION_SIGNING_KEY, WORKER_TOKEN,
                  DEBO_OS_VAPID_PUBLIC_KEY, DEBO_OS_VAPID_PRIVATE_KEY, DEBO_OS_VAPID_SUBJECT}
                 | with_entries(select(.value != null and .value != ""))' \
            > "$RUNNER_TEMP/api-secrets.json"
          # PUBLIC_API_URL is api.debo.life (callbacks); api.daksha.life is an alias, so health and
          # sign-in called on it hand out api.daksha.life (os/apps/server/src/public-address.ts).
          # my.daksha.life comes first in ALLOWED_ORIGINS: the API uses the first https origin as the
          # app's own address (links back to the app, and the Origin for phone sign-in).
          # my.debo.life stays allowed for a tab that still runs an old copy.
          npx wrangler deploy -c api/wrangler.jsonc \
            --secrets-file "$RUNNER_TEMP/api-secrets.json" \
            --var "PUBLIC_API_URL:${{ steps.urls.outputs.callback_api }}" \
            --var "PUBLIC_API_URL_ALIASES:${{ steps.urls.outputs.api }}" \
            --var "ALLOWED_ORIGINS:${{ steps.urls.outputs.app }},${{ steps.urls.outputs.old_app }}"

      - name: Deploy the app
        working-directory: os/infra/cloudflare
        run: npx wrangler deploy -c app/wrangler.jsonc

      - name: Smoke test
        run: |
          api="${{ steps.urls.outputs.api }}"
          app="${{ steps.urls.outputs.app }}"
          callback_api="${{ steps.urls.outputs.callback_api }}"
          old_app="${{ steps.urls.outputs.old_app }}"
          # A new container can take several minutes to provision after the first deploy, and a
          # new custom domain a few minutes to get its certificate.
          ok=""
          for i in $(seq 1 40); do
            body=$(curl -s --max-time 30 "$api/api/health" || true)
            if echo "$body" | jq -e '.ok == true' >/dev/null 2>&1; then ok=1; break; fi
            echo "attempt $i: not ready yet"; sleep 15
          done
          [ -n "$ok" ] || { echo "::error::$api/api/health never returned ok"; exit 1; }
          echo "API health: $body"
          echo "$body" | jq -e '.browserConfigured == true' >/dev/null || { echo "::error::browser not configured"; exit 1; }
          echo "$body" | jq -e '.auth.mode == "neon"' >/dev/null || { echo "::error::API is not in Neon Auth mode"; exit 1; }
          # The app built against api.daksha.life must sign in there, not on api.debo.life.
          echo "$body" | jq -e --arg url "$api/api/neon-auth" '.auth.neonAuthUrl == $url' >/dev/null \
            || { echo "::error::$api/api/health does not hand out its own sign-in address"; exit 1; }
          # The journal route must answer 401 (it needs sign-in), not 404 or a crash.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$api/api/debo/status")" = "401"
          # api.debo.life must keep serving: installed phone apps and the OAuth callbacks use it.
          old=$(curl -s --max-time 30 "$callback_api/api/health" || true)
          echo "$old" | jq -e --arg url "$callback_api/api/neon-auth" '.ok == true and .auth.neonAuthUrl == $url' >/dev/null \
            || { echo "::error::$callback_api/api/health is not answering with its own sign-in address"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' "$app/")" = "200"
          # Single-page-app fallback: a deep link must serve the app shell.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$app/some/deep/link")" = "200"
          # The old app address answers 307 to the same path and query on the new one.
          moved=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$old_app/journal?x=1")
          echo "$old_app/journal?x=1 -> $moved"
          test "$moved" = "307 $app/journal?x=1"
          echo "Up: app $app, api $api (also $callback_api)"
