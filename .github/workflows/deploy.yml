# Deploy the web app (apps/web) to Cloudflare Workers at daksha.life.
# Runs on every push to main, or by hand from the Actions tab.
# Secrets used (names only; set in GitHub repo settings > Secrets):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  - for wrangler
#   DATABASE_URL_UNPOOLED                         - database migrations, and OpenNext's
#                                                   deploy step needs a Postgres string
#                                                   to stand in for the Hyperdrive binding
# App secrets (Neon Auth, storage, AI gateway) live in Cloudflare as Worker
# secrets, not here. See docs/SETUP.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply database migrations
        run: pnpm --filter @debo/db db:migrate
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}

      - name: Build and deploy
        working-directory: apps/web
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: ${{ secrets.DATABASE_URL_UNPOOLED }}

      - name: Check the live site
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://daksha.life/privacy)
          echo "daksha.life/privacy returned $code"
          test "$code" = "200"

      # The landing page moved to www.daksha.life, and debo.life moved to daksha.life, both with
      # a 307 that keeps the path. /api/* is served on every host. The webhook route answers
      # anything but 404 or a redirect when it is there. Only warnings: a custom domain can take
      # a few minutes after a deploy to settle.
      - name: Check the redirects
        run: |
          check() {
            got=$(curl -s -m 20 -o /dev/null -w '%{http_code} %{redirect_url}' "$1" || true)
            echo "$1 -> $got"
            [ "$got" = "$2" ] || echo "::warning::$1 answered '$got', expected '$2'"
          }
          check "https://daksha.life/?from=check" "307 https://www.daksha.life/?from=check"
          check "https://debo.life/privacy?from=check" "307 https://daksha.life/privacy?from=check"
          check "https://www.debo.life/" "307 https://www.daksha.life/"
          for url in https://daksha.life/api/neon-auth/webhook https://debo.life/api/neon-auth/webhook; do
            code=$(curl -s -m 20 -o /dev/null -w '%{http_code}' "$url" || true)
            echo "$url -> $code"
            case "$code" in 404|30*|000) echo "::warning::$url answered $code";; esac
          done
