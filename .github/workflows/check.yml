# Run every check on a branch before it reaches main.
#
# The deploy workflows only typecheck the part they deploy. This one runs the whole set:
# the brand check (no old brand name left, see docs/RENAME.md), the root typecheck, and the os/
# workspace's typecheck and tests. Push a branch
# (for example debo-os) and wait for this to pass before fast-forwarding main.
name: Check

on:
  push:
    branches: [debo-os]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  brand:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Fails if the old brand name or an old address is outside the allowlist in docs/RENAME.md.
      - run: node scripts/check-brand.mjs

  root:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  os:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: os/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: pnpm --dir os install --frozen-lockfile
      - name: Typecheck
        run: pnpm --dir os typecheck
      - name: Tests
        run: pnpm --dir os test
