# Deploy the investor pitch site (apps/pitch) to Cloudflare Workers as "debo-pitch".
# It is served at pitch.daksha.life. pitch.debo.life sends pages there with a 307 (docs/DOMAINS.md).
# Runs on a push to main that touches the pitch site, or by hand.
# Secrets used (names only): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: Deploy pitch site

on:
  push:
    branches: [main]
    paths: ["apps/pitch/**", ".github/workflows/deploy-pitch.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-pitch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @debo/pitch typecheck

      - name: Build and deploy
        working-directory: apps/pitch
        run: pnpm run deploy

      - name: Live check
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -m 20 -o /dev/null -w '%{http_code}' https://pitch.daksha.life/ || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::pitch.daksha.life did not answer 200"; exit 1

      # pitch.debo.life answers 307 to the same path on pitch.daksha.life. Only a warning.
      - name: Check the old address
        run: |
          got=$(curl -s -m 20 -o /dev/null -w '%{http_code} %{redirect_url}' "https://pitch.debo.life/market?from=check" || true)
          echo "pitch.debo.life -> $got"
          [ "$got" = "307 https://pitch.daksha.life/market?from=check" ] || echo "::warning::pitch.debo.life did not answer 307 yet"
