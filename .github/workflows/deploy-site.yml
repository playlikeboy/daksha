# Deploy the landing page (apps/site) to Cloudflare Workers as "debo-site".
# It is served at www.daksha.life. about.daksha.life and about.debo.life send pages there with a 307.
# daksha.life itself is still served by debo-web (docs/DOMAINS.md).
# Runs on a push to main that touches the landing page, or by hand.
# Secrets used (names only): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["apps/site/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @debo/site typecheck

      - name: Build and deploy
        working-directory: apps/site
        run: pnpm run deploy

      - name: Live check
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -m 20 -o /dev/null -w '%{http_code}' https://www.daksha.life/ || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::www.daksha.life did not answer 200"; exit 1

      # The older addresses answer 307 to the same path and query on www.daksha.life. Only a
      # warning: a custom domain can take a few minutes after a deploy to settle.
      - name: Check the old addresses
        run: |
          for host in about.daksha.life about.debo.life; do
            got=$(curl -s -m 20 -o /dev/null -w '%{http_code} %{redirect_url}' "https://$host/?from=check" || true)
            echo "$host -> $got"
            [ "$got" = "307 https://www.daksha.life/?from=check" ] || echo "::warning::$host did not answer 307 to www.daksha.life yet"
          done
