<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <!-- my.debo.life is the address from before the rename to Daksha (docs/DOMAINS.md). Its Worker
         answers every request there with a 307 to my.daksha.life (os/infra/cloudflare/app/src/index.ts).
         This script is a second guard for a copy of this page served some other way: the app talks
         to api.daksha.life, whose sign-in cookie a debo.life page cannot keep. -->
    <script>
      if (/(^|\.)debo\.life$/.test(location.hostname)) {
        location.replace("https://my.daksha.life" + location.pathname + location.search + location.hash);
      }
    </script>
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="A friendly assistant that remembers your life. Ask about your own life and see where every answer came from." />

    <!-- Install as an app. The manifest makes Chrome open Daksha in its own window, with no address bar. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FBF6EF" />
    <meta name="application-name" content="Daksha" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Daksha" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Share picture. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Daksha" />
    <meta property="og:url" content="https://my.debo.life" />
    <meta property="og:title" content="Daksha: a friendly assistant that remembers your life" />
    <meta property="og:description" content="Ask about your own life. Every answer shows where it came from." />

    <meta property="og:image:height" content="630" />

    <meta name="twitter:description" content="Ask about your own life. Every answer shows where it came from." />

    <!-- Daksha does not nag people to install it. Chrome would show its own small install bar; this keeps it away.
         Installing still works from the browser menu. The app's menu has a quiet "Get the app" link instead. -->
    <script>
      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
      });
    </script>

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

    <!-- Daksha's own browser details (DESIGN.md, accessibility floor). Colours are the brand
         tokens in src/brand-tokens.ts: ink #221B16, paper #FBF6EF, tomato wash #FDE3DC. -->
    <style id="debo-base">
      html,
      body {
        background: #fbf6ef;
        color: #221b16;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* A clear ring on whatever the keyboard is on, and none for mouse or touch. */
      :focus-visible {
        outline: 3px solid #221b16;
        outline-offset: 3px;
      }
      :focus:not(:focus-visible) {
        outline: none;
      }
      /* A text field shows the ring whenever it has the caret, however it was reached. */
      input:focus,
      textarea:focus {
        outline: 3px solid #221b16;
        outline-offset: 2px;
      }
      input,
      textarea {
        caret-color: #b8281c;
      }
      ::selection {
        background: #fde3dc;
        color: #221b16;
      }
      * {
        scrollbar-color: #d4c5b2 transparent;
      }
      /* Reduce motion: stop CSS transitions and animations too, not only the drawn ones. */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
